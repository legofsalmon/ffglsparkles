name: release

# Releases are cut by pushing a tag, so the binaries people download are built
# from a known commit by the same checks that gate every other build, rather
# than uploaded by hand from somebody's laptop.
on:
  push:
    tags: ['v*']
  # Cutting a release from the Actions UI, for when pushing a tag is not
  # convenient. Supplying a version here publishes exactly as a tag push would;
  # the Releases API creates the tag against the chosen commit. Leaving it empty
  # exercises the packaging without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0. Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # The same tests that run on every push, run again against the exact commit
  # being released.
  test:
    name: test (linux, software GL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenGL development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglew-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: package (windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64 -DSPARKLES_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # plugMain is the only symbol a host looks up, and it lives in a
      # translation unit nothing else references. Shipping a binary that lost it
      # would produce a plugin that loads nowhere and says nothing about why.
      - name: Verify the plugin entry point is exported
        shell: pwsh
        timeout-minutes: 5
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "could not locate dumpbin.exe" }

          Get-ChildItem build/src/plugins/Release/*.dll | ForEach-Object {
            Write-Host "== $($_.Name)"
            $exports = & $dumpbin /exports $_.FullName
            if (-not ($exports -match 'plugMain')) { throw "plugMain not exported from $($_.Name)" }
          }

      - name: Verify the DLLs carry the version
        shell: pwsh
        run: |
          # An installed DLL is the only place a Windows user can see which
          # build they have, and a version resource that silently fails to
          # compile in leaves Properties -> Details blank — invisible from the
          # source, which is exactly the class of failure this repo keeps
          # finding. Assert it on the artifact, not on the intent.
          $expected = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          Write-Host "CMakeLists declares $expected"
          Get-ChildItem build/src/plugins/Release/*.dll | ForEach-Object {
            $got = $_.VersionInfo.FileVersion
            Write-Host "== $($_.Name) FileVersion=$got"
            if (-not $got) { throw "$($_.Name) carries no version resource" }
            if ($got.Split(',').Count -gt 1) { $got = ($got -replace ',\s*','.') }
            if (-not $got.StartsWith($expected)) {
              throw "$($_.Name) reports $got, CMakeLists says $expected"
            }
          }

      # The FFGL SDK and GLEW are BSD-style and require their copyright notice
      # to accompany binary redistribution. Generating the file from the
      # licences actually in the tree keeps it honest if either one moves.
      - name: Stage the archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item build/src/plugins/Release/*.dll staging/
          Copy-Item packaging/INSTALL-windows.txt staging/INSTALL.txt
          if (Test-Path LICENSE) { Copy-Item LICENSE staging/ }

          $notice  = "Sparkles links the following third-party components.`n`n"
          $notice += "=" * 72 + "`nFreeFrame / FFGL SDK`n" + "=" * 72 + "`n`n"
          $notice += Get-Content external/ffgl/LICENSE.md -Raw
          $notice += "`n`n" + "=" * 72 + "`nGLEW - The OpenGL Extension Wrangler Library`n" + "=" * 72 + "`n`n"
          $notice += Get-Content external/ffgl/deps/glew-2.1.0/LICENSE.txt -Raw
          Set-Content -Path staging/THIRD-PARTY.txt -Value $notice

          Compress-Archive -Path staging/* -DestinationPath sparkles-windows-x64.zip

      - name: Verify the archive layout
        shell: pwsh
        run: |
          $entries = (Get-ChildItem staging).Name
          foreach ($expected in @('Sparkles.dll','INSTALL.txt','THIRD-PARTY.txt')) {
            if ($entries -notcontains $expected) { throw "$expected missing from the archive" }
          }
          Write-Host "layout ok: $($entries -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: sparkles-windows-x64
          path: sparkles-windows-x64.zip
          if-no-files-found: error

  macos:
    name: package (macos universal)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSPARKLES_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # Resolume 7.11+ runs natively on Apple Silicon and will not load an
      # x86_64-only plugin, so a single-architecture bundle is a broken release
      # for half the audience.
      - name: Verify architectures and entry point
        run: |
          for bundle in build/src/plugins/*.bundle; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .bundle)"
            echo "== $binary"
            lipo -archs "$binary"
            lipo -archs "$binary" | grep -q arm64
            lipo -archs "$binary" | grep -q x86_64
            nm -gU "$binary" | grep -qw _plugMain
          done

      - name: Verify the bundles carry the version
        run: |
          # Same reason as the Windows check. macOS has carried the version in
          # Info.plist since 0.1, but nothing has ever asserted it agrees with
          # CMakeLists — and pkgbuild compares the BUNDLE's version, not the
          # package's, when deciding whether an install is an upgrade. A stale
          # one here is an upgrade that silently does not happen.
          expected=$( sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1 )
          echo "CMakeLists declares ${expected}"
          for bundle in build/src/plugins/*.bundle; do
            got=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" )
            echo "== $(basename "$bundle") CFBundleShortVersionString=${got}"
            if [ "$got" != "$expected" ]; then
              echo "::error::$(basename "$bundle") reports ${got}, CMakeLists says ${expected}"
              exit 1
            fi
          done

      # The zip and the installer, built and verified by the same script the
      # build workflow runs on every pull request. The installer is the reason
      # for all of this: a .zip propagates com.apple.quarantine to everything it
      # extracts, Resolume will not load a quarantined plug-in that is not
      # notarised, and it says nothing when it refuses. An installer payload is
      # not quarantined. Signing and notarising happen only when the secrets
      # are configured on this repository; without them the package still
      # works, behind one Gatekeeper dialog.
      - name: Package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # From CMakeLists, the same place the bundle's own version comes from.
          # The publish job refuses a tag that disagrees with it.
          version=$( sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1 )
          bash packaging/macos/package.sh build/src/plugins "$version" dist

      - uses: actions/upload-artifact@v4
        with:
          name: sparkles-macos-universal
          path: dist/sparkles-macos-universal.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sparkles-macos-pkg
          path: dist/sparkles-macos.pkg
          if-no-files-found: error

  publish:
    name: publish release
    needs: [test, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve the version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi

          # Normalise to a leading v. A tag push always has one, because the
          # trigger filter is 'v*', but the dispatch input is free text and
          # entering "0.1.3" would publish a tag without one, the odd one out
          # among the releases. The workflow should not depend on whoever fills
          # the box remembering.
          case "$version" in
            v*) ;;
            *)  version="v${version}" ;;
          esac

          # A version that is not vMAJOR.MINOR.PATCH is far more likely to be a
          # typo in the dispatch box than an intentional tag, and a published
          # release is awkward to retract.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::version '${version}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # The tag and CMakeLists must agree, because they feed different
          # artifacts and nothing downstream reconciles them: the .pkg takes its
          # version from this tag, while the bundles inside it take theirs from
          # PROJECT_VERSION. A tag cut against an unbumped CMakeLists publishes
          # a package advertising the new version whose payload still claims the
          # old one — and pkgbuild compares the BUNDLE's version when deciding
          # whether an install is an upgrade, so the upgrade silently does not
          # happen. The download is named correctly and installs nothing.
          declared=$( sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1 )
          # Strip the leading v and any -rc / +build suffix before comparing.
          bare="${version#v}"
          bare="${bare%%[-+]*}"
          if [ "$bare" != "$declared" ]; then
            echo "::error::tag ${version} does not match CMakeLists VERSION ${declared}."
            echo "::error::Bump CMakeLists.txt, or tag ${declared}. The .pkg takes its version"
            echo "::error::from the tag and the bundles take theirs from CMakeLists; if they"
            echo "::error::disagree the installer reports success and upgrades nothing."
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "releasing ${version} (CMakeLists agrees: ${declared})"

      - name: Name the archives after the version
        run: |
          mkdir -p release
          mv artifacts/sparkles-windows-x64.zip      "release/sparkles-${VERSION}-windows-x64.zip"
          mv artifacts/sparkles-macos-universal.zip  "release/sparkles-${VERSION}-macos-universal.zip"
          mv artifacts/sparkles-macos.pkg            "release/sparkles-${VERSION}-macos.pkg"
          ls -la release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Explicit rather than inferred from the ref, so a dispatched release
          # works too. The Releases API creates the tag if it does not exist.
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*
          # 0.x is a pre-release: nothing has been validated inside Resolume
          # yet. Make this false from the first version that has been.
          prerelease: ${{ startsWith(env.VERSION, 'v0.') }}
          generate_release_notes: false
          body_path: packaging/RELEASE-NOTES.md
